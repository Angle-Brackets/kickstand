[package]
name = "switch-mcp-proto"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Wire protocol shared by the switch-mcp daemon and MCP server"

[lib]
name = "proto"

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
