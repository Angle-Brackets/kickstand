<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kickstand Live</title>
<style>
  :root { --bg: #0d0d0f; --panel: #17171b; --text: #e8e8ec; --muted: #8b8b96; --accent: #ff2e2e; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f4f6; --panel: #ffffff; --text: #18181c; --muted: #6b6b76; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif; }
  main { max-width: 1280px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; letter-spacing: 0.02em; }
  h1 span { color: var(--accent); }
  .live { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }
  #status, #awake { color: var(--muted); font-size: 13px; }
  .screen { background: #000; border-radius: 10px; overflow: hidden; aspect-ratio: 16 / 9; box-shadow: 0 6px 30px rgba(0,0,0,0.35); }
  .screen img { width: 100%; height: 100%; display: block; object-fit: contain; }
</style>
</head>
<body>
<main>
  <header>
    <span class="live"></span>
    <h1>Kick<span>stand</span> live</h1>
    <span id="status">connecting…</span>
    <span id="awake"></span>
  </header>
  <div class="screen"><img src="/stream" alt="The Switch's screen"></div>
</main>
<script>
  async function poll() {
    try {
      const s = await (await fetch('/status')).json();
      document.getElementById('status').textContent = s.app;
      document.getElementById('awake').textContent = s.awake;
    } catch (e) {
      document.getElementById('status').textContent = 'kickstand watch stopped';
    }
  }
  poll();
  setInterval(poll, 3000);
</script>
</body>
</html>
