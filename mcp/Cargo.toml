[package]
name = "kickstand"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "MCP server that drives the kickstand daemon on a Nintendo Switch"

[dependencies]
proto = { package = "kickstand-proto", path = "../proto" }
rmcp = { version = "3.7", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "io-std", "time", "fs", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
base64 = "0.22"
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "gif"] }
flate2 = "1"
addr2line = { version = "0.25", features = ["loader", "rustc-demangle", "cpp_demangle"] }
object = { version = "0.37", default-features = false, features = ["read", "std"] }
