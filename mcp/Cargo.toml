[package]
name = "kickstand"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "MCP server that drives the kickstand daemon on a Nintendo Switch"

[dependencies]
proto = { package = "kickstand-proto", path = "../proto" }
rmcp = { version = "3.7", features = ["server", "transport-io", "macros", "elicitation"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "io-std", "time", "fs", "sync", "process", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
base64 = "0.22"
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "gif", "png"] }
flate2 = "1"
addr2line = { version = "0.25", features = ["loader", "rustc-demangle", "cpp_demangle"] }
object = { version = "0.37", default-features = false, features = ["read", "std"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The desktop app (`kickstand` with no command, from a terminal or a launcher).
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "wayland", "accesskit", "clipboard", "default_fonts"] }
toml_edit = "0.23"
# The updater: GitHub releases over HTTPS, their signed SHA256SUMS, and the PC build's archive.
ureq = { version = "3", features = ["json"] }
semver = "1"
sha2 = "0.10"
ed25519-dalek = "2"
tar = "0.4"
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-perl"] }
