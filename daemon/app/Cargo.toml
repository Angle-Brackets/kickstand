[package]
name = "kickstand-nro"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The daemon as an hbmenu NRO, for testing before the sysmodule is installed"

# The NRO is named after the binary: kickstand.nro.
[[bin]]
name = "kickstand"
path = "src/main.rs"

[dependencies]
nx = { workspace = true, features = ["socket", "fs", "input", "console"] }
daemon-core.workspace = true
nxlink.workspace = true
services.workspace = true
proto.workspace = true

[package.metadata.nx.nro]
nacp = { default_name = "kickstand daemon", default_author = "Angle-Brackets", version = "0.1.0" }
