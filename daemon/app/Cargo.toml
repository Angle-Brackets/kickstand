[package]
name = "kickstand-nro"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The daemon as an hbmenu NRO, for testing before the sysmodule is installed"

# The NRO is named after the binary: kickstand.nro.
[[bin]]
name = "kickstand"
path = "src/main.rs"

[dependencies]
nx = { workspace = true, features = ["socket", "fs", "input", "console", "truetype"] }
# Measuring text for layout (the same version nx draws with).
ab_glyph = { version = "0.2.31", default-features = false, features = ["variable-fonts", "libm"] }
daemon-core.workspace = true
nxlink.workspace = true
services.workspace = true
proto.workspace = true

[package.metadata.nx.nro]
icon = "../../assets/logo/kickstand-icon.jpg"
nacp = { default_name = "kickstand daemon", default_author = "Angle-Brackets", version = "0.1.0" }
